name: CI and Deploy
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly Monday 08:17 PKT: catch external link rot
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://ha2mad.github.io/pk-salary-tools/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check-links
      - name: External link check
        uses: lycheeverse/lychee-action@v2
        with:
          # Root-relative assets are /pk-salary-tools/assets/... while files live in dist/assets.
          # --base would also rewrite directory-relative links and drop the project path.
          # Map that prefix onto dist, and fail the job only on the weekly schedule.
          args: >-
            --no-progress --max-retries 3 --accept 200,403,429
            --root-dir ${{ github.workspace }}/dist
            --remap "file://${{ github.workspace }}/dist/pk-salary-tools file://${{ github.workspace }}/dist"
            dist
          fail: ${{ github.event_name == 'schedule' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://ha2mad.github.io/pk-salary-tools/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Wait for Pages CDN
        run: sleep 30
      - name: Every referenced asset returns 200 with correct type
        run: node scripts/check-deployed.mjs
