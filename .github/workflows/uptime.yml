name: Uptime check
on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  uptime:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://ha2mad.github.io/pk-salary-tools/' }}
    steps:
      - name: Check every page in the sitemap
        id: check
        run: |
          set -u
          urls=$(curl -fsS --retry 3 "${SITE_URL}sitemap.xml" | grep -oE '<loc>[^<]+' | sed 's/<loc>//') || urls=""
          urls="$urls ${SITE_URL}sitemap.xml ${SITE_URL}robots.txt ${SITE_URL}embed/tax.snippet.html ${SITE_URL}embed/increment.snippet.html ${SITE_URL}embed/zakat.snippet.html"
          fails=""
          for u in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --max-time 20 "$u")
            echo "$code $u"
            [ "$code" = "200" ] || fails="$fails\n- $u → HTTP $code"
          done
          if [ -n "$fails" ]; then
            printf "failed<<EOF\n%b\nEOF\n" "$fails" >> "$GITHUB_OUTPUT"
            echo "::error::Uptime check failed"; exit 1
          fi
      - name: Open or update uptime issue
        if: failure()
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.check.outputs.failed }}
        with:
          script: |
            const title = "Uptime check failing";
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nFailed URLs:${process.env.FAILED || "\n- sitemap could not be fetched"}`;
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "uptime" });
            if (data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: data[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["uptime"] });
